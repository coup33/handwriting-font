<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>손글씨 폰트 메이커</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      overscroll-behavior: none;        /* 당겨서 새로고침 방지 */
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;       /* 더블탭 줌 방지 */
      -webkit-user-select: none;        /* 글자 선택/드래그 방지 */
      user-select: none;
      -webkit-touch-callout: none;      /* 길게 눌렀을 때 메뉴 방지 */
    }

    /* 입력창만 선택 허용 */
    input { -webkit-user-select: text; user-select: text; }
    /* 이미지/요소 드래그 방지 */
    img, .char-btn, .guide-label, .nav-btn, .btn { -webkit-user-drag: none; }

    header {
      background: #16213e;
      padding: 12px 20px;
      padding-top: max(12px, env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #0f3460;
      flex-wrap: wrap;
    }

    header h1 { font-size: 1.1rem; color: #e94560; letter-spacing: 1px; white-space: nowrap; }

    .progress-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .progress-fill {
      width: 140px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill-inner { height: 100%; background: #e94560; transition: width 0.3s; }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ── 왼쪽: 문자 선택 ───────────────────────────────── */
    .char-panel {
      width: 240px;
      background: #16213e;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .char-panel-title {
      padding: 12px 16px;
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #0f3460;
    }

    .char-group {
      padding: 10px 12px 4px;
      font-size: 0.7rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .char-grid { display: flex; flex-wrap: wrap; padding: 0 12px 8px; gap: 5px; }

    .char-btn {
      width: 40px;
      height: 40px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      position: relative;
      flex-shrink: 0;
      touch-action: manipulation;
    }

    .char-btn:hover { background: #0f3460; color: #fff; }
    .char-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

    .char-btn.done::after {
      content: '';
      position: absolute;
      bottom: 3px; right: 3px;
      width: 7px; height: 7px;
      background: #4caf50;
      border-radius: 50%;
    }
    .char-btn.active.done::after { background: #fff; }

    .char-panel-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

    /* ── 가운데: 그리기 영역 ───────────────────────────── */
    .draw-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 16px;
      min-height: 0;
      overflow: auto;
    }

    .current-char-label { font-size: 1rem; color: #aaa; text-align: center; }

    .canvas-wrapper {
      position: relative;
      border: 2px solid #0f3460;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      width: min(62vmin, 460px);
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      touch-action: none;               /* 캔버스 영역에서 스크롤 차단 */
    }

    .guide-label {
      position: absolute;
      font-size: 16vmin;
      font-weight: bold;
      color: rgba(0,0,0,0.09);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }
    /* 한글 자모: 짝 글자를 들어갈 위치에 표시 */
    .guide-label.guide-right  { top: 50%; left: 72%; }
    .guide-label.guide-bottom { top: 73%; left: 50%; }
    .guide-label.guide-left   { top: 42%; left: 27%; }
    .guide-label.guide-top    { top: 30%; left: 50%; }

    /* 4선 기준선 (베이스라인/x-height 등) */
    .guide-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .guide-lines .line { position: absolute; left: 0; right: 0; height: 1px; }
    .line.baseline { bottom: 18%; background: rgba(233,69,96,0.35); }
    .line.xheight  { bottom: 48%; background: rgba(0,0,0,0.08); }
    .line.cap      { top: 14%;    background: rgba(0,0,0,0.08); }

    #draw-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      position: relative;
      z-index: 1;
      touch-action: none;               /* 그릴 때 스크롤/줌 차단 */
    }

    .draw-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.15s;
      touch-action: manipulation;
    }

    .btn-primary { background: #e94560; color: #fff; }
    .btn-primary:hover { background: #c73652; }
    .btn-secondary { background: #0f3460; color: #ccc; }
    .btn-secondary:hover { background: #1a4a7a; color: #fff; }

    .nav-btn {
      width: 44px; height: 44px;
      border-radius: 8px;
      border: none;
      background: #0f3460;
      color: #ccc;
      font-size: 1.2rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .nav-btn:hover { background: #1a4a7a; color: #fff; }

    .stroke-slider {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #aaa;
    }
    .stroke-slider input { width: 90px; }

    .pen-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 10px;
      background: #0f3460;
      color: #888;
    }
    .pen-badge.active { background: #2e7d32; color: #fff; }

    .mode-toggle { display: flex; gap: 4px; background: #0f3460; padding: 3px; border-radius: 8px; }
    .mode-btn { border: none; background: transparent; color: #aaa; padding: 6px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; touch-action: manipulation; }
    .mode-btn.active { background: #e94560; color: #fff; }
    body.ko-mode .guide-lines { display: none; }
    #compose-info { color: #888; }

    /* ── 오른쪽: 미리보기 / 내보내기 ───────────────────── */
    .preview-panel {
      width: 270px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .preview-panel h3 {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #preview-text-input, .font-name-input {
      width: 100%;
      padding: 10px 12px;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      color: #ccc;
      font-size: 0.9rem;
    }

    .preview-canvas-wrap { background: #fff; border-radius: 8px; overflow: hidden; }
    #preview-canvas { display: block; width: 100%; }

    .export-section { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .export-section h3 { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }

    .done-count { font-size: 0.78rem; color: #aaa; }
    .done-count span { color: #4caf50; font-weight: bold; }

    .btn-export {
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.15s;
      text-align: center;
      touch-action: manipulation;
    }
    .btn-export.ttf { background: #1565c0; color: #fff; }
    .btn-export.ttf:hover { background: #0d47a1; }
    .btn-export.woff { background: #6a1b9a; color: #fff; }
    .btn-export.woff:hover { background: #4a148c; }
    .btn-export:disabled { opacity: 0.4; cursor: not-allowed; }

    .reset-btn {
      background: none;
      border: 1px solid #5a2a35;
      color: #b56;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .reset-btn:hover { background: #2a1419; }

    .install-hint {
      font-size: 0.72rem;
      color: #777;
      line-height: 1.5;
      background: #1a1a2e;
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .install-hint b { color: #aaa; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #4caf50;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.3s;
      z-index: 1000;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #e94560; }

    /* ── 반응형: 아이패드 세로 / 좁은 화면 ───────────────── */
    @media (max-width: 1000px), (orientation: portrait) {
      main { flex-direction: column; overflow-y: auto; }

      .char-panel {
        width: 100%;
        flex-direction: column;
        border-right: none;
        border-bottom: 1px solid #0f3460;
        order: 1;
      }
      .char-panel-scroll {
        display: flex;
        flex-direction: row;
        align-items: center;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 8px 0;
      }
      .char-group {
        padding: 0 8px;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        white-space: nowrap;
        align-self: center;
        font-size: 0.6rem;
      }
      .char-grid { flex-wrap: nowrap; padding: 0 6px; }
      .char-panel-title { display: none; }

      .draw-area { order: 2; padding: 16px; }
      .canvas-wrapper { width: min(80vmin, 520px); }
      .guide-label { font-size: 22vmin; }

      .preview-panel {
        order: 3;
        width: 100%;
        border-left: none;
        border-top: 1px solid #0f3460;
      }
      .export-section { margin-top: 12px; }
    }
  </style>
</head>
<body>

<header>
  <h1>✍️ 손글씨 폰트 메이커</h1>
  <div class="mode-toggle">
    <button id="mode-en" class="mode-btn active" onclick="setMode('en')">영어</button>
    <button id="mode-ko" class="mode-btn" onclick="setMode('ko')">한글자모</button>
    <button id="mode-kosyl" class="mode-btn" onclick="setMode('kosyl')">한글음절</button>
  </div>
  <div class="progress-bar">
    <span class="pen-badge" id="pen-badge">손가락/마우스</span>
    <div class="progress-fill">
      <div class="progress-fill-inner" id="progress-inner" style="width:0%"></div>
    </div>
    <span id="progress-text">0 / 62</span>
  </div>
</header>

<main>
  <!-- 문자 선택 패널 -->
  <div class="char-panel">
    <div class="char-panel-title">문자 선택</div>
    <div class="char-panel-scroll" id="char-panel-scroll"></div>
  </div>

  <!-- 그리기 영역 -->
  <div class="draw-area">
    <div class="current-char-label" id="current-char-label">문자를 선택하세요</div>
    <div class="canvas-wrapper">
      <div class="guide-label" id="guide-label"></div>
      <div class="guide-lines">
        <div class="line cap"></div>
        <div class="line xheight"></div>
        <div class="line baseline"></div>
      </div>
      <canvas id="draw-canvas" width="512" height="512"></canvas>
    </div>
    <div class="draw-controls">
      <button class="nav-btn" onclick="navChar(-1)" title="이전 문자">‹</button>
      <div class="stroke-slider">
        굵기
        <input type="range" id="stroke-width" min="3" max="40" value="14" />
        <span id="stroke-val">14</span>
      </div>
      <button class="btn btn-secondary" onclick="undoStroke()">되돌리기</button>
      <button class="btn btn-secondary" onclick="clearCanvas()">지우기</button>
      <button class="btn btn-primary" onclick="saveChar()">저장 →</button>
      <button class="nav-btn" onclick="navChar(1)" title="다음 문자">›</button>
    </div>
    <div style="font-size:0.74rem; color:#666; text-align:center;">
      Apple Pencil 사용 시 필압에 따라 굵기가 자동 조절됩니다 · 저장하면 다음 문자로 이동
    </div>
  </div>

  <!-- 미리보기 / 내보내기 패널 -->
  <div class="preview-panel">
    <h3>미리보기</h3>
    <input type="text" id="preview-text-input" placeholder="텍스트 입력..." value="Hello 123" oninput="updatePreview()" />
    <div class="preview-canvas-wrap">
      <canvas id="preview-canvas" height="100"></canvas>
    </div>

    <div class="export-section">
      <h3>내보내기</h3>
      <div class="done-count">완성: <span id="done-count">0</span> / <span id="total-count">62</span>자<span id="compose-info"></span></div>
      <input type="text" class="font-name-input" id="font-name" placeholder="폰트 이름 (예: MyFont)" value="MyHandwriting" />
      <button class="btn-export ttf" onclick="exportFont('ttf')" id="btn-ttf">TTF 다운로드</button>
      <button class="btn-export woff" onclick="exportFont('woff')" id="btn-woff">WOFF 다운로드</button>
      <div class="install-hint">
        <b>아이패드 설치법:</b> TTF를 받으면 '파일' 앱에 저장됩니다.
        <b>AnyFont</b> 같은 글꼴 설치 앱으로 열어 프로필을 설치하면
        Pages·Keynote 등에서 사용할 수 있어요.
      </div>
      <button class="reset-btn" onclick="resetAll()">전체 초기화</button>
      <div style="font-size:0.65rem; color:#556; text-align:right;">버전 v12 · 2026-06-29</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>

<script>
// ── 한글 자모 데이터 ────────────────────────────────────────────────────────
const CHO  = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JONG_SINGLES = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
// 겹받침 → 단자음 2개로 분해
const JONG_DECOMP = {
  'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],
  'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']
};
// 중성 분류: v=세로(오른쪽), h=가로(아래), m=섞임
const JUNG_VERTICAL   = new Set(['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅣ']);
const JUNG_HORIZONTAL = new Set(['ㅗ','ㅛ','ㅜ','ㅠ','ㅡ']);
function jungType(v) {
  if (JUNG_VERTICAL.has(v)) return 'v';
  if (JUNG_HORIZONTAL.has(v)) return 'h';
  return 'm';
}
// 직접 그리는 단순 모음 14개 (섞임모음은 그리지 않고 아래 분해로 합성)
const JUNG_SIMPLE = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
// 섞임모음 → [가로파트, 세로파트]
const MIXED_DECOMP = {
  'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],
  'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ']
};
function isHangulSyllable(cp) { return cp >= 0xAC00 && cp <= 0xD7A3; }

// ── 모드별 문자 그룹 ────────────────────────────────────────────────────────
// item = { key(저장키), label(표시) }.  영문은 key=label, 한글은 역할 접두사 부여
const GROUPS_EN = [
  { label: 'A–Z', items: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => ({ key: c, label: c })) },
  { label: 'a–z', items: 'abcdefghijklmnopqrstuvwxyz'.split('').map(c => ({ key: c, label: c })) },
  { label: '0–9', items: '0123456789'.split('').map(c => ({ key: c, label: c })) },
];
const GROUPS_KO = [
  { label: '초성 (ㅏㅓ 옆모음용)', items: CHO.map(c => ({ key: 'Cv:' + c, label: c })) },
  { label: '초성 (ㅗㅜ 밑모음용)', items: CHO.map(c => ({ key: 'Ch:' + c, label: c })) },
  { label: '중성 (모음)',          items: JUNG_SIMPLE.map(v => ({ key: 'V:' + v, label: v })) },
  { label: '종성 (받침)',          items: JONG_SINGLES.map(c => ({ key: 'F:' + c, label: c })) },
];
// ── 음절 따라쓰기 세트 (목표 음절 → 영역별로 자모 추출) ──────────────────────
function syllChar(cho, jung, jong) {
  const code = 0xAC00 + (CHO.indexOf(cho) * 21 + JUNG.indexOf(jung)) * 28 + (jong ? JONG.indexOf(jong) : 0);
  return String.fromCharCode(code);
}
// extract: { 영역: 저장키 }  (영역 cho/jung/jong 의 획을 그 키로 저장)
function traceItem(cho, jung, jong, extract) {
  return { key: 'SYL:' + syllChar(cho, jung, jong), label: syllChar(cho, jung, jong),
           char: syllChar(cho, jung, jong), vowelType: jungType(jung), hasJong: !!jong, extract };
}
const REMAIN_VOWELS = JUNG_SIMPLE.filter(v => v !== 'ㅏ' && v !== 'ㅗ');   // ㅏㅗ 외 단순모음 12개
const GROUPS_KOSYL = [
  { label: '옆모음 초성 (X+ㅏ)', items: CHO.map((c, i) => traceItem(c, 'ㅏ', '', i === 0 ? { cho:'Cv:'+c, jung:'V:ㅏ' } : { cho:'Cv:'+c })) },
  { label: '밑모음 초성 (X+ㅗ)', items: CHO.map((c, i) => traceItem(c, 'ㅗ', '', i === 0 ? { cho:'Ch:'+c, jung:'V:ㅗ' } : { cho:'Ch:'+c })) },
  { label: '모음 (ㅇ+모음)',      items: REMAIN_VOWELS.map(v => traceItem('ㅇ', v, '', { jung:'V:'+v })) },
  { label: '받침 (앗받침)',       items: JONG_SINGLES.map(j => traceItem('ㅇ', 'ㅏ', j, { jong:'F:'+j })) },
];

const PREVIEW_DEFAULT = { en: 'Hello 123', ko: '한글 손글씨', kosyl: '한글 손글씨' };

const STORE_KEY = 'hwfont_strokes_v2';
const NAME_KEY  = 'hwfont_name';
const MODE_KEY  = 'hwfont_mode';

// 저장된 획 데이터: { key: [ { points: [{x,y,w}] } ] }
let savedStrokes = {};
let currentMode = 'en';
let currentKey = null;
let panelBtns = {};       // key → 버튼 엘리먼트

let isDrawing = false;
let activePointerId = null;
let currentStroke = [];
let allStrokes = [];
let koGuide = null;             // 한글 자모 가이드
let currentTraceItem = null;    // 음절 모드: 현재 따라쓰는 음절 정보
let reviewAssign = null;        // 음절 모드: 획별 분류 ['cho'|'jung'|'jong'] (검토중일 때만)

const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');

function currentGroups() {
  if (currentMode === 'en') return GROUPS_EN;
  if (currentMode === 'kosyl') return GROUPS_KOSYL;
  return GROUPS_KO;
}
function currentKeys()   { return currentGroups().flatMap(g => g.items.map(i => i.key)); }
function findItem(key) {
  for (const g of currentGroups()) for (const it of g.items) if (it.key === key) return it;
  return null;
}
function labelForKey(key) { const it = findItem(key); return it ? it.label : key; }
function groupLabelForKey(key) {
  for (const g of currentGroups()) for (const it of g.items) if (it.key === key) return g.label;
  return '';
}
// 항목 완성 여부 (음절 모드는 추출 대상 키가 모두 있으면 완성)
function itemDone(it) {
  if (currentMode === 'kosyl') return it.extract && Object.values(it.extract).every(k => savedStrokes[k]);
  return !!savedStrokes[it.key];
}

// ── 모드 전환 ───────────────────────────────────────────────────────────────
function setMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;
  document.getElementById('mode-en').classList.toggle('active', mode === 'en');
  document.getElementById('mode-ko').classList.toggle('active', mode === 'ko');
  document.getElementById('mode-kosyl').classList.toggle('active', mode === 'kosyl');
  document.body.classList.toggle('ko-mode', mode !== 'en');   // 한글 계열은 기준선 숨김
  document.getElementById('preview-text-input').value = PREVIEW_DEFAULT[mode];
  reviewAssign = null;
  try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}

  buildCharPanel();
  selectKey(currentKeys()[0]);
  updateProgress();
  updatePreview();
}

// ── 문자 패널 구성 ──────────────────────────────────────────────────────────
function buildCharPanel() {
  const panel = document.getElementById('char-panel-scroll');
  panel.innerHTML = '';
  panelBtns = {};
  currentGroups().forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'char-group';
    groupEl.textContent = group.label;
    panel.appendChild(groupEl);

    const grid = document.createElement('div');
    grid.className = 'char-grid';
    group.items.forEach(it => {
      const btn = document.createElement('button');
      btn.className = 'char-btn' + (itemDone(it) ? ' done' : '');
      btn.textContent = it.label;
      btn.onclick = () => selectKey(it.key);
      panelBtns[it.key] = btn;
      grid.appendChild(btn);
    });
    panel.appendChild(grid);
  });
}

function selectKey(key) {
  if (currentKey && panelBtns[currentKey]) panelBtns[currentKey].classList.remove('active');
  currentKey = key;
  const btn = panelBtns[key];
  if (btn) {
    btn.classList.add('active');
    btn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
  const label = labelForKey(key);

  // ── 음절 따라쓰기 모드 ──
  if (currentMode === 'kosyl') {
    currentTraceItem = findItem(key);
    reviewAssign = null;
    allStrokes = [];                          // 매번 새로 따라 씀
    document.getElementById('guide-label').textContent = '';
    document.getElementById('current-char-label').textContent =
      `따라 쓰기: "${label}"  ·  초성=빨강 / 중성=초록 / 종성=파랑 칸`;
    redrawCanvas();
    return;
  }

  document.getElementById('current-char-label').textContent =
    currentMode === 'en' ? `현재 문자: "${label}"` : `현재 자모: "${label}" — ${groupLabelForKey(key)}`;

  // 가이드: 한글은 짝 글자를 실제 조합 위치/크기로 캔버스에 흐리게 + 그릴 위치(점선) 표시
  const guide = document.getElementById('guide-label');
  koGuide = null;
  if (currentMode === 'ko') {
    guide.textContent = '';                 // HTML 가이드는 비우고 캔버스에 직접 그림
    const role = key.slice(0, key.indexOf(':'));
    const sub  = key.slice(key.indexOf(':') + 1);
    if (role === 'Cv') {                     // 초성(옆모음용): 오른쪽에 ㅏ (자음 쪽으로 붙임)
      const b = layoutBoxes('v', false);
      koGuide = { chars:[{ch:'ㅏ', box:b.jung, ax:0, ay:0.5}], target:b.cho };
    } else if (role === 'Ch') {              // 초성(밑모음용): 아래에 ㅜ (자음 쪽=위로 붙임)
      const b = layoutBoxes('h', false);
      koGuide = { chars:[{ch:'ㅜ', box:b.jung, ax:0.5, ay:0}], target:b.cho };
    } else if (role === 'V') {               // 중성: ㄱ
      const b = layoutBoxes(jungType(sub), false);
      koGuide = { chars:[{ch:'ㄱ', box:b.cho, ax:0.5, ay:0.5}], target:b.jung };
    } else if (role === 'F') {               // 종성: '각'을 칸 전체에 그린 뒤 받침 영역만 잘라냄
      const b = layoutBoxes('v', true);
      const full = {
        x: Math.min(b.cho.x, b.jung.x, b.jong.x),
        y: Math.min(b.cho.y, b.jung.y, b.jong.y),
        w: Math.max(b.cho.x+b.cho.w, b.jung.x+b.jung.w, b.jong.x+b.jong.w) - Math.min(b.cho.x, b.jung.x, b.jong.x),
        h: Math.max(b.cho.y+b.cho.h, b.jung.y+b.jung.h, b.jong.y+b.jong.h) - Math.min(b.cho.y, b.jung.y, b.jong.y)
      };
      koGuide = { chars:[{ch:'각', box:full, ax:0.5, ay:0.5, clipAbove:b.jong}], target:b.jong };
    }
  } else {
    guide.textContent = label;
    guide.className = 'guide-label guide-center';
  }

  allStrokes = savedStrokes[key] ? JSON.parse(JSON.stringify(savedStrokes[key])) : [];
  redrawCanvas();
}

function navChar(dir) {
  const keys = currentKeys();
  if (!currentKey) { selectKey(keys[0]); return; }
  const next = keys.indexOf(currentKey) + dir;
  if (next >= 0 && next < keys.length) selectKey(keys[next]);
}

// ── 입력 위치 / 굵기 ────────────────────────────────────────────────────────
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top)  * (canvas.height / rect.height)
  };
}

// 필압 → 굵기. pen이면 압력 반영, 아니면 슬라이더 고정값
function getWidth(e) {
  const base = parseInt(document.getElementById('stroke-width').value);
  if (e.pointerType === 'pen' && e.pressure > 0) {
    return base * (0.35 + e.pressure * 1.35);  // 약 0.35x ~ 1.7x
  }
  return base;
}

function markPenBadge(type) {
  const badge = document.getElementById('pen-badge');
  if (type === 'pen') { badge.textContent = 'Apple Pencil'; badge.classList.add('active'); }
  else { badge.textContent = (type === 'touch' ? '터치' : '마우스'); badge.classList.remove('active'); }
}

// ── 그리기 (Pointer Events) ─────────────────────────────────────────────────
function startDraw(e) {
  if (!currentKey) { showToast('먼저 문자를 선택하세요', true); return; }
  // 음절 검토 중: 그리기 대신 획 탭 → 분류 변경
  if (currentMode === 'kosyl' && reviewAssign) { e.preventDefault(); reassignStrokeAt(getPos(e)); return; }
  if (isDrawing) return;
  e.preventDefault();
  markPenBadge(e.pointerType);
  isDrawing = true;
  activePointerId = e.pointerId;
  canvas.setPointerCapture?.(e.pointerId);
  const p = getPos(e); p.w = getWidth(e);
  currentStroke = [p];
}

function draw(e) {
  if (!isDrawing || e.pointerId !== activePointerId) return;
  e.preventDefault();

  // coalesced 이벤트로 부드럽게 (Apple Pencil 고주파 샘플)
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of events) {
    const p = getPos(ev); p.w = getWidth(ev);
    currentStroke.push(p);
  }

  // 마지막 세그먼트만 실시간 렌더
  const pts = currentStroke;
  if (pts.length < 2) return;
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  ctx.lineWidth = (a.w + b.w) / 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

function endDraw(e) {
  if (!isDrawing || e.pointerId !== activePointerId) return;
  e.preventDefault();
  isDrawing = false;
  activePointerId = null;

  if (currentStroke.length === 1) {
    // 점 하나만 찍힌 경우(점/i의 점 등) — 미세 세그먼트로 보존
    const p = currentStroke[0];
    currentStroke.push({ x: p.x + 0.5, y: p.y + 0.5, w: p.w });
  }
  if (currentStroke.length > 1) allStrokes.push({ points: currentStroke });
  currentStroke = [];
  redrawCanvas();
}

function drawStrokePath(targetCtx, points, widthScale = 1, color = '#111') {
  if (points.length < 2) return;
  targetCtx.lineCap = 'round';
  targetCtx.lineJoin = 'round';
  targetCtx.strokeStyle = color;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    targetCtx.lineWidth = ((a.w + b.w) / 2) * widthScale;
    targetCtx.beginPath();
    targetCtx.moveTo(a.x, a.y);
    targetCtx.lineTo(b.x, b.y);
    targetCtx.stroke();
  }
}

const REGION_COLOR = { cho: '#e94560', jung: '#2e9a44', jong: '#1f78c8' };

function redrawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGuideLayer();
  if (currentMode === 'kosyl' && reviewAssign) {
    allStrokes.forEach((s, i) => drawStrokePath(ctx, s.points, 1, REGION_COLOR[reviewAssign[i]] || '#111'));
  } else {
    allStrokes.forEach(s => drawStrokePath(ctx, s.points));
  }
}

function clearCanvas() {
  allStrokes = [];
  reviewAssign = null;
  redrawCanvas();
}

// 한글 가이드(짝 글자 + 그릴 위치 점선)를 캔버스 배경에 렌더
function drawGuideLayer() {
  if (currentMode === 'kosyl') { drawTraceGuide(); return; }
  if (currentMode !== 'ko' || !koGuide) return;
  koGuide.chars.forEach(c => {
    const clipY = c.clipAbove ? boxToPx(c.clipAbove).y : null;   // 이 y 아래(받침 영역)는 가림
    drawGuideGlyph(c.ch, boxToPx(c.box), c.ax, c.ay, clipY);
  });
  if (koGuide.target) outlineBox(koGuide.target, 'rgba(233,69,96,0.30)');
}

function unionBoxes(boxes) {
  const x = Math.min(...boxes.map(b => b.x));
  const y = Math.min(...boxes.map(b => b.y));
  return { x, y,
    w: Math.max(...boxes.map(b => b.x + b.w)) - x,
    h: Math.max(...boxes.map(b => b.y + b.h)) - y };
}

function outlineBox(b, color) {
  const t = boxToPx(b);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.setLineDash([7, 7]);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(t.x, t.y, t.w, t.h);
  ctx.restore();
}

// 음절 따라쓰기 가이드: 흐린 목표 음절 + 초/중/종 영역 색 박스
function drawTraceGuide() {
  if (!currentTraceItem) return;
  const it = currentTraceItem;
  const b = layoutBoxes(it.vowelType, it.hasJong);
  const boxes = it.hasJong ? [b.cho, b.jung, b.jong] : [b.cho, b.jung];
  drawGuideGlyph(it.char, boxToPx(unionBoxes(boxes)), 0.5, 0.5);
  outlineBox(b.cho, 'rgba(233,69,96,0.32)');                  // 초성=빨강
  outlineBox(b.jung, 'rgba(46,154,68,0.32)');                 // 중성=초록
  if (b.jong) outlineBox(b.jong, 'rgba(31,120,200,0.32)');    // 종성=파랑
}

// 폰트 좌표 박스(y 위로+, 베이스라인0) → 캔버스 픽셀 박스
function boxToPx(b) {
  const sx = canvas.width / 1000;
  const topPx = canvas.height * 0.08, basePx = canvas.height * 0.92;
  const sy = (basePx - topPx) / HANGUL_TOP;
  return { x: b.x * sx, y: basePx - (b.y + b.h) * sy, w: b.w * sx, h: b.h * sy };
}

// 짝 글자를 실제 폰트 글리프로, 박스에 맞춰(비율유지) 앵커 정렬해 흐리게 그림
// ax/ay: 0=좌/상, 0.5=중앙, 1=우/하
function drawGuideGlyph(ch, box, ax, ay, clipBottomY) {
  ctx.save();
  if (clipBottomY != null) {                 // 받침 영역(아래)을 잘라 '각−받침'처럼 보이게
    ctx.beginPath();
    ctx.rect(0, 0, canvas.width, clipBottomY);
    ctx.clip();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  const probe = 300;
  ctx.font = 'bold ' + probe + 'px -apple-system, system-ui, sans-serif';
  ctx.textBaseline = 'alphabetic';
  const m = ctx.measureText(ch);
  const asc  = m.actualBoundingBoxAscent  || probe * 0.70;
  const desc = m.actualBoundingBoxDescent || 0;
  const left = (m.actualBoundingBoxLeft  != null) ? m.actualBoundingBoxLeft  : 0;
  const right= (m.actualBoundingBoxRight != null) ? m.actualBoundingBoxRight : m.width;
  const gw = (left + right) || m.width || probe * 0.6;
  const gh = (asc + desc) || probe * 0.7;
  const s = Math.min(box.w / gw, box.h / gh) * 0.92;
  const drawW = gw * s, drawH = gh * s;
  const px = box.x + (box.w - drawW) * ax;   // 잉크 좌상단 위치 (앵커 적용)
  const py = box.y + (box.h - drawH) * ay;
  ctx.translate(px, py);
  ctx.scale(s, s);
  ctx.fillText(ch, left, asc);               // 잉크 좌상단을 (0,0)에 맞춤
  ctx.restore();
}

function undoStroke() {
  if (allStrokes.length === 0) return;
  allStrokes.pop();
  reviewAssign = null;     // 검토 상태였다면 해제하고 다시 그리기 단계로
  redrawCanvas();
}

// ── 저장 / 영속화 ───────────────────────────────────────────────────────────
function saveChar() {
  if (!currentKey) { showToast('문자를 선택하세요', true); return; }

  if (currentMode === 'kosyl') { handleSyllableSave(); return; }

  if (allStrokes.length === 0) { showToast('먼저 글자를 그려주세요', true); return; }

  savedStrokes[currentKey] = JSON.parse(JSON.stringify(allStrokes));
  panelBtns[currentKey]?.classList.add('done');

  persist();
  updateProgress();
  updatePreview();
  showToast(`"${labelForKey(currentKey)}" 저장 완료!`);

  const keys = currentKeys();
  const idx = keys.indexOf(currentKey);
  if (idx < keys.length - 1) selectKey(keys[idx + 1]);
}

// ── 음절 따라쓰기: 추출 → 검토 → 확정 ───────────────────────────────────────
function handleSyllableSave() {
  if (!reviewAssign) {
    if (allStrokes.length === 0) { showToast('먼저 음절을 따라 쓰세요', true); return; }
    reviewAssign = assignStrokes(currentTraceItem);   // 영역별 자동 분류
    redrawCanvas();                                    // 색으로 표시
    showToast('색 확인! 틀린 획은 탭해서 초→중→종 변경, 다시 [저장]으로 확정');
  } else {
    commitExtract(currentTraceItem, reviewAssign);
  }
}

function strokeCentroid(s) {
  let x = 0, y = 0; s.points.forEach(p => { x += p.x; y += p.y; });
  return { x: x / s.points.length, y: y / s.points.length };
}

// 각 획을 초/중/종 영역에 배정 (중심점이 든 박스, 없으면 가장 가까운 박스)
function assignStrokes(item) {
  const b = layoutBoxes(item.vowelType, item.hasJong);
  const regions = [['cho', boxToPx(b.cho)], ['jung', boxToPx(b.jung)]];
  if (item.hasJong) regions.push(['jong', boxToPx(b.jong)]);
  return allStrokes.map(s => {
    const c = strokeCentroid(s);
    let inside = regions.find(([, r]) => c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h);
    if (inside) return inside[0];
    let best = regions[0][0], bestD = Infinity;
    regions.forEach(([name, r]) => {
      const dx = c.x - (r.x + r.w / 2), dy = c.y - (r.y + r.h / 2), d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = name; }
    });
    return best;
  });
}

// 검토 중 획 탭 → 분류 순환 (초→중→종→초)
function reassignStrokeAt(pos) {
  let idx = -1, bestD = Infinity;
  allStrokes.forEach((s, i) => {
    s.points.forEach(p => {
      const d = (p.x - pos.x) ** 2 + (p.y - pos.y) ** 2;
      if (d < bestD) { bestD = d; idx = i; }
    });
  });
  if (idx < 0 || Math.sqrt(bestD) > 60) return;   // 너무 멀면 무시
  const cycle = currentTraceItem.hasJong ? ['cho', 'jung', 'jong'] : ['cho', 'jung'];
  const cur = cycle.indexOf(reviewAssign[idx]);
  reviewAssign[idx] = cycle[(cur + 1) % cycle.length];
  redrawCanvas();
}

// 확정: 영역별 획을 추출 대상 키로 저장
function commitExtract(item, assign) {
  const groups = { cho: [], jung: [], jong: [] };
  allStrokes.forEach((s, i) => groups[assign[i]].push(JSON.parse(JSON.stringify(s))));

  const saved = [];
  for (const region in item.extract) {
    const key = item.extract[region];
    if (groups[region] && groups[region].length) { savedStrokes[key] = groups[region]; saved.push(key.split(':')[1]); }
  }
  if (saved.length === 0) { showToast('분류된 획이 없어요. 다시 시도', true); return; }

  persist();
  reviewAssign = null;
  allStrokes = [];
  buildCharPanel();                  // done 표시 갱신
  updateProgress();
  updatePreview();
  showToast(`추출 완료: ${saved.join(', ')}`);

  const keys = currentKeys();
  const idx = keys.indexOf(currentKey);
  if (idx < keys.length - 1) selectKey(keys[idx + 1]); else { selectKey(currentKey); }
}

function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(savedStrokes));
    localStorage.setItem(NAME_KEY, document.getElementById('font-name').value);
  } catch (err) { /* 용량 초과 등은 조용히 무시 */ }
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) savedStrokes = JSON.parse(raw);
    const name = localStorage.getItem(NAME_KEY);
    if (name) document.getElementById('font-name').value = name;
    const mode = localStorage.getItem(MODE_KEY);
    if (mode === 'en' || mode === 'ko' || mode === 'kosyl') currentMode = mode;
  } catch (err) { savedStrokes = {}; }

  document.getElementById('mode-en').classList.toggle('active', currentMode === 'en');
  document.getElementById('mode-ko').classList.toggle('active', currentMode === 'ko');
  document.getElementById('mode-kosyl').classList.toggle('active', currentMode === 'kosyl');
  document.body.classList.toggle('ko-mode', currentMode !== 'en');
}

function resetAll() {
  if (!confirm('저장한 모든 글자(영어+한글)를 삭제할까요? 되돌릴 수 없습니다.')) return;
  savedStrokes = {};
  localStorage.removeItem(STORE_KEY);
  buildCharPanel();
  clearCanvas();
  selectKey(currentKeys()[0]);
  updateProgress();
  updatePreview();
  showToast('초기화되었습니다');
}

function updateProgress() {
  const items = currentGroups().flatMap(g => g.items);
  const done = items.filter(itemDone).length;
  const total = items.length;
  document.getElementById('done-count').textContent = done;
  document.getElementById('total-count').textContent = total;
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-inner').style.width = `${(done / total) * 100}%`;

  const info = document.getElementById('compose-info');
  info.textContent = currentMode !== 'en' ? ` · 조합가능 ${countComposable()}자` : '';
}

// 현재 그려진 자모로 만들 수 있는 음절 수
function countComposable() {
  let n = 0;
  for (let code = 0xAC00; code <= 0xD7A3; code++) {
    if (composeSyllable(code)) n++;
  }
  return n;
}

// ── 미리보기 ───────────────────────────────────────────────────────────────
function updatePreview() {
  const text = document.getElementById('preview-text-input').value || PREVIEW_DEFAULT[currentMode];
  const pc = document.getElementById('preview-canvas');
  const w = pc.parentElement.clientWidth || 238;
  pc.width = w;
  pc.height = 100;
  const pctx = pc.getContext('2d');
  pctx.clearRect(0, 0, pc.width, pc.height);

  const charH = 80;
  const scale = charH / canvas.height;          // 캔버스 좌표(영문) → 픽셀
  const baseY = 10 + GUIDE_BASELINE * charH;     // 베이스라인 픽셀
  const scKo  = (baseY - 10) / HANGUL_TOP;       // 폰트 좌표(한글) → 픽셀
  let x = 8;

  for (const ch of text) {
    if (x > pc.width) break;
    const cp = ch.codePointAt(0);

    if (ch === ' ') { x += charH * 0.3; continue; }

    // 한글 음절 → 합성
    if (isHangulSyllable(cp)) {
      const placed = composeSyllable(cp);
      if (placed) {
        renderPlacedPreview(pctx, placed, x, baseY, scKo);
        x += HANGUL_ADVANCE * scKo + 4;
      } else {
        pctx.fillStyle = '#bbb';
        pctx.font = `${charH * 0.82}px system-ui`;
        pctx.fillText(ch, x, baseY);
        x += charH * 0.9;
      }
      continue;
    }

    // 영문/숫자
    if (savedStrokes[ch]) {
      const strokes = savedStrokes[ch];
      let minX = Infinity, maxX = -Infinity;
      strokes.forEach(s => s.points.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); }));
      const charW = Math.max(maxX - minX, 10);
      pctx.save();
      pctx.translate(x - minX * scale, 10);
      pctx.scale(scale, scale);
      strokes.forEach(s => drawStrokePath(pctx, s.points));
      pctx.restore();
      x += charW * scale + 6;
    } else {
      pctx.fillStyle = '#bbb';
      pctx.font = `${charH * 0.7}px system-ui`;
      pctx.fillText(ch, x, charH * 0.85);
      x += charH * 0.55;
    }
  }
}

// 폰트 좌표(y 위로 +, 베이스라인 0)의 placed strokes를 미리보기에 렌더
function renderPlacedPreview(pctx, placed, ox, baseY, sc) {
  pctx.lineCap = 'round';
  pctx.lineJoin = 'round';
  pctx.strokeStyle = '#111';
  placed.forEach(st => {
    const pts = st.points;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      pctx.lineWidth = (a.hw + b.hw) * sc;       // hw=반굵기 → 전체=2*hw, 평균=(a.hw+b.hw)
      pctx.beginPath();
      pctx.moveTo(ox + a.x * sc, baseY - a.y * sc);
      pctx.lineTo(ox + b.x * sc, baseY - b.y * sc);
      pctx.stroke();
    }
  });
}

// ── 폰트 메트릭 (가이드선 기준 정규화) ──────────────────────────────────────
// CSS 가이드선 위치(캔버스 높이 대비 비율). baseline: 아래에서 18%, cap: 위에서 14%
const GUIDE_BASELINE = 0.82;   // 베이스라인의 y 비율 (위에서부터)
const GUIDE_CAP      = 0.14;   // 캡라인의 y 비율 (위에서부터)
const CAP_HEIGHT     = 700;    // em 1000 기준 대문자 높이
const SIDE_BEARING   = 30;     // 글자 좌우 여백 (작게 → 자간 빽빽)

// 캔버스 좌표 → 폰트 좌표 변환 계수 (가이드선 기준)
function fontMetrics() {
  const baselineY = canvas.height * GUIDE_BASELINE;
  const capY      = canvas.height * GUIDE_CAP;
  const scale     = CAP_HEIGHT / (baselineY - capY);   // 캡↔베이스라인 높이를 CAP_HEIGHT로
  return { baselineY, scale };
}

// 해당 글자의 좌측 잉크 시작 x (좌우 공백 제거용)
function glyphMinX(strokes) {
  let minX = Infinity;
  strokes.forEach(s => s.points.forEach(p => { minX = Math.min(minX, p.x); }));
  return isFinite(minX) ? minX : 0;
}

// ── 외곽선 생성 (폰트 좌표 placed strokes → opentype.Path) ───────────────────
// placed: [ { points: [{x, y, hw}] } ]  (y 위로 +, hw=반굵기)
function outlineFromStrokes(placed) {
  const path = new opentype.Path();
  placed.forEach(stroke => {
    const pts = stroke.points;
    if (pts.length < 2) return;
    const { left, right } = buildStrokeOutline(pts);
    if (left.length < 2) return;

    path.moveTo(left[0].x, left[0].y);
    for (let i = 1; i < left.length; i++) path.lineTo(left[i].x, left[i].y);
    buildCap(pts[pts.length - 1], right[right.length - 1], left[left.length - 1], pts[pts.length - 1].hw)
      .forEach(p => path.lineTo(p.x, p.y));
    for (let i = right.length - 1; i >= 0; i--) path.lineTo(right[i].x, right[i].y);
    buildCap(pts[0], left[0], right[0], pts[0].hw).forEach(p => path.lineTo(p.x, p.y));
    path.close();
  });
  return path;
}

// ── 영문: 획 → 폰트 외곽선 (가이드선 기준 정규화) ───────────────────────────
function strokesToOpentypePath(strokes) {
  const { baselineY, scale } = fontMetrics();
  const minX = glyphMinX(strokes);
  const placed = strokes.map(s => ({
    points: s.points.map(p => ({
      x: (p.x - minX) * scale + SIDE_BEARING,
      y: (baselineY - p.y) * scale,
      hw: (p.w * scale) / 2
    }))
  }));
  return outlineFromStrokes(placed);
}

// ── 한글 조합 엔진 ──────────────────────────────────────────────────────────
const HANGUL_TOP     = 800;    // 음절 칸 상단 (폰트 좌표)
const HANGUL_ADVANCE = 1000;   // 한글은 전각 고정폭

// 자모 획(캔버스 좌표)을 폰트 좌표 박스에 균일 스케일 + 중앙 배치
// box = { x:좌, y:하단, w, h }  (y 위로 +)
function placeJamo(strokes, box) {
  if (!strokes || !strokes.length) return [];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  strokes.forEach(s => s.points.forEach(p => {
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
  }));
  if (!isFinite(minX)) return [];
  const bw = Math.max(maxX - minX, 1), bh = Math.max(maxY - minY, 1);
  const sc = Math.min(box.w / bw, box.h / bh);
  const ox = box.x + (box.w - bw * sc) / 2;
  const oy = box.y + (box.h - bh * sc) / 2;
  return strokes.map(s => ({
    points: s.points.map(p => ({
      x: ox + (p.x - minX) * sc,
      y: oy + (maxY - p.y) * sc,    // 캔버스 y(아래+) → 폰트 y(위+)
      hw: (p.w * sc) / 2
    }))
  }));
}

// 중성 모양 + 받침 유무에 따른 배치 박스
function layoutBoxes(jt, hasJong) {
  if (jt === 'v') {  // 세로모음 (오른쪽): 초성 왼쪽 + 모음 오른쪽
    return hasJong
      ? { cho:{x:90,y:430,w:330,h:330}, jung:{x:460,y:400,w:470,h:360}, jong:{x:120,y:60,w:760,h:300} }
      : { cho:{x:90,y:90,w:340,h:650},  jung:{x:470,y:60,w:470,h:700} };
  }
  if (jt === 'h') {  // 가로모음 (아래): 초성 위(가운데) + 모음 아래
    return hasJong
      ? { cho:{x:320,y:540,w:360,h:220}, jung:{x:120,y:310,w:760,h:210}, jong:{x:120,y:60,w:760,h:220} }
      : { cho:{x:300,y:430,w:400,h:330}, jung:{x:120,y:80,w:760,h:320} };
  }
  // 섞임모음(ㅘㅞㅢ): 좌측칸=자음(위)+가로파트ㅜㅗ(아래), 우측칸=세로파트ㅏㅔ(세로 전체)
  return hasJong
    ? { cho:{x:90,y:520,w:360,h:240}, jungH:{x:90,y:300,w:400,h:180}, jungV:{x:540,y:300,w:380,h:460}, jong:{x:120,y:60,w:760,h:200} }
    : { cho:{x:90,y:440,w:370,h:310}, jungH:{x:90,y:70,w:400,h:320}, jungV:{x:560,y:70,w:370,h:690} };
}

// 음절코드 → placed strokes (폰트 좌표). 필요한 자모 없으면 null
function composeSyllable(code) {
  const s = code - 0xAC00;
  if (s < 0 || s >= 11172) return null;
  const cho  = CHO[Math.floor(s / 588)];
  const jung = JUNG[Math.floor((s % 588) / 28)];
  const jongIdx = s % 28;
  const jong = JONG[jongIdx];
  const jt = jungType(jung);
  const hasJong = jongIdx > 0;
  const box = layoutBoxes(jt, hasJong);

  let placed;
  if (jt === 'm') {                                    // 섞임모음: 분해 합성
    const [hPart, vPart] = MIXED_DECOMP[jung];
    const cS = savedStrokes['Cv:' + cho];
    const hS = savedStrokes['V:' + hPart];
    const vS = savedStrokes['V:' + vPart];
    if (!cS || !hS || !vS) return null;
    placed = placeJamo(cS, box.cho).concat(placeJamo(hS, box.jungH)).concat(placeJamo(vS, box.jungV));
  } else {
    const cS = savedStrokes[(jt === 'v' ? 'Cv:' : 'Ch:') + cho];
    const vS = savedStrokes['V:' + jung];
    if (!cS || !vS) return null;
    placed = placeJamo(cS, box.cho).concat(placeJamo(vS, box.jung));
  }

  if (hasJong) {
    if (JONG_DECOMP[jong]) {                       // 겹받침 → 좌우 분할
      const [a, b] = JONG_DECOMP[jong];
      const sa = savedStrokes['F:' + a], sb = savedStrokes['F:' + b];
      if (!sa || !sb) return null;
      const half = box.jong.w / 2 - 10;
      placed = placed
        .concat(placeJamo(sa, { x: box.jong.x, y: box.jong.y, w: half, h: box.jong.h }))
        .concat(placeJamo(sb, { x: box.jong.x + box.jong.w / 2 + 10, y: box.jong.y, w: half, h: box.jong.h }));
    } else {
      const sj = savedStrokes['F:' + jong];
      if (!sj) return null;
      placed = placed.concat(placeJamo(sj, box.jong));
    }
  }
  return placed.length ? placed : null;
}

function buildStrokeOutline(pts) {
  const left = [], right = [];
  for (let i = 0; i < pts.length; i++) {
    let dx, dy;
    if (i === 0)                  { dx = pts[1].x - pts[0].x;       dy = pts[1].y - pts[0].y; }
    else if (i === pts.length - 1){ dx = pts[i].x - pts[i-1].x;     dy = pts[i].y - pts[i-1].y; }
    else                         { dx = pts[i+1].x - pts[i-1].x;    dy = pts[i+1].y - pts[i-1].y; }

    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const nx = -dy / len, ny = dx / len;     // 법선
    const hw = pts[i].hw;
    left.push({  x: pts[i].x + nx * hw, y: pts[i].y + ny * hw });
    right.push({ x: pts[i].x - nx * hw, y: pts[i].y - ny * hw });
  }
  return { left, right };
}

function buildCap(center, from, to, hw) {
  const steps = 6;
  const a0 = Math.atan2(from.y - center.y, from.x - center.x);
  const a1 = Math.atan2(to.y - center.y,   to.x - center.x);
  const result = [];
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const angle = a0 + (a1 - a0) * t;
    result.push({ x: center.x + Math.cos(angle) * hw, y: center.y + Math.sin(angle) * hw });
  }
  return result;
}

// 글자 폭(advance) = 잉크 폭 + 좌우 여백 (가이드 기준 스케일 적용)
function computeAdvanceWidth(strokes) {
  const { scale } = fontMetrics();
  let minX = Infinity, maxX = -Infinity;
  strokes.forEach(s => s.points.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); }));
  if (!isFinite(minX)) return Math.round(CAP_HEIGHT * 0.5);
  return Math.round((maxX - minX) * scale + SIDE_BEARING * 2);
}

// ── 폰트 내보내기 ──────────────────────────────────────────────────────────
function exportFont(format) {
  if (!window.opentype) { showToast('opentype.js 로딩 중입니다. 잠시 후 시도하세요.', true); return; }
  if (Object.keys(savedStrokes).length === 0) { showToast('저장된 문자가 없습니다', true); return; }

  showToast('폰트 생성 중...');
  // UI가 토스트를 그릴 시간을 준 뒤 무거운 작업 실행
  setTimeout(() => {
    try { buildAndDownload(format); }
    catch (err) { showToast('생성 실패: ' + err.message, true); }
  }, 50);
}

function buildAndDownload(format) {
  const fontName  = document.getElementById('font-name').value.trim() || 'MyHandwriting';
  const emSize    = 1000;
  const ascender  = 800;
  const descender = -200;

  const glyphs = [
    new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: 500, path: new opentype.Path() }),
    new opentype.Glyph({ name: 'space', unicode: 32, advanceWidth: Math.round(emSize * 0.3), path: new opentype.Path() })
  ];

  // 영문/숫자 (그려진 것만)
  GROUPS_EN.forEach(g => g.items.forEach(it => {
    const strokes = savedStrokes[it.key];
    if (!strokes) return;
    glyphs.push(new opentype.Glyph({
      name: `uni${it.key.charCodeAt(0).toString(16).padStart(4,'0')}`,
      unicode: it.key.charCodeAt(0),
      advanceWidth: computeAdvanceWidth(strokes),
      path: strokesToOpentypePath(strokes)
    }));
  }));

  // 한글 음절 (조합 가능한 것만)
  let hangulCount = 0;
  for (let code = 0xAC00; code <= 0xD7A3; code++) {
    const placed = composeSyllable(code);
    if (!placed) continue;
    glyphs.push(new opentype.Glyph({
      name: `uni${code.toString(16).toUpperCase().padStart(4,'0')}`,
      unicode: code,
      advanceWidth: HANGUL_ADVANCE,
      path: outlineFromStrokes(placed)
    }));
    hangulCount++;
  }

  const font = new opentype.Font({
    familyName: fontName, styleName: 'Regular',
    unitsPerEm: emSize, ascender, descender, glyphs
  });

  const buf = font.toArrayBuffer();
  if (format === 'ttf') {
    downloadBuf(buf, fontName + '.ttf', 'font/ttf');
  } else {
    downloadBuf(ttfToWoff(buf), fontName + '.woff', 'font/woff');
  }
  showToast(`완료! 영문+숫자, 한글 ${hangulCount}자 (${format.toUpperCase()})`);
}

// ── TTF → WOFF (비압축 래핑) ────────────────────────────────────────────────
function ttfToWoff(ttfBuf) {
  const sfnt = new DataView(ttfBuf);
  const numTables = sfnt.getUint16(4);

  const tables = [];
  for (let i = 0; i < numTables; i++) {
    const o = 12 + i * 16;
    const tag = String.fromCharCode(sfnt.getUint8(o), sfnt.getUint8(o+1), sfnt.getUint8(o+2), sfnt.getUint8(o+3));
    tables.push({ tag, checkSum: sfnt.getUint32(o+4), offset: sfnt.getUint32(o+8), length: sfnt.getUint32(o+12) });
  }

  const woffHeaderSize = 44;
  const tableDirSize = numTables * 20;
  const paddedLengths = tables.map(t => (t.length + 3) & ~3);
  let totalSize = woffHeaderSize + tableDirSize;
  paddedLengths.forEach(l => totalSize += l);

  const woff = new ArrayBuffer(totalSize);
  const dv = new DataView(woff);
  const u8 = new Uint8Array(woff);
  let pos = 0;

  dv.setUint32(pos, 0x774F4646); pos += 4;        // 'wOFF'
  dv.setUint32(pos, sfnt.getUint32(0)); pos += 4;  // flavor
  dv.setUint32(pos, totalSize); pos += 4;
  dv.setUint16(pos, numTables); pos += 2;
  dv.setUint16(pos, 0); pos += 2;
  dv.setUint32(pos, ttfBuf.byteLength); pos += 4;
  dv.setUint16(pos, 1); pos += 2;
  dv.setUint16(pos, 0); pos += 2;
  dv.setUint32(pos, 0); pos += 4;
  dv.setUint32(pos, 0); pos += 4;
  dv.setUint32(pos, 0); pos += 4;
  dv.setUint32(pos, 0); pos += 4;
  dv.setUint32(pos, 0); pos += 4;

  let dataPos = woffHeaderSize + tableDirSize;
  tables.forEach((t, i) => {
    for (let c = 0; c < 4; c++) dv.setUint8(pos++, t.tag.charCodeAt(c));
    dv.setUint32(pos, dataPos); pos += 4;
    dv.setUint32(pos, t.length); pos += 4;
    dv.setUint32(pos, t.length); pos += 4;
    dv.setUint32(pos, t.checkSum); pos += 4;
    u8.set(new Uint8Array(ttfBuf, t.offset, t.length), dataPos);
    dataPos += paddedLengths[i];
  });

  return woff;
}

function downloadBuf(buf, filename, mime) {
  const blob = new Blob([buf], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ── 토스트 ─────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2500);
}

// ── 이벤트 등록 (Pointer Events) ────────────────────────────────────────────
canvas.addEventListener('pointerdown', startDraw);
canvas.addEventListener('pointermove', draw);
canvas.addEventListener('pointerup', endDraw);
canvas.addEventListener('pointercancel', endDraw);
canvas.addEventListener('pointerleave', endDraw);
// iOS Safari 제스처 차단
['gesturestart','gesturechange','gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
// 그리는 중 화면 스크롤 차단 + 요소 드래그 차단
document.addEventListener('touchmove', e => { if (isDrawing) e.preventDefault(); }, { passive: false });
document.addEventListener('dragstart', e => e.preventDefault());

document.getElementById('stroke-width').addEventListener('input', function() {
  document.getElementById('stroke-val').textContent = this.value;
});
document.getElementById('font-name').addEventListener('input', persist);
window.addEventListener('resize', updatePreview);

// ── 초기화 ─────────────────────────────────────────────────────────────────
loadSaved();                                   // savedStrokes + 모드 복원
document.getElementById('preview-text-input').value = PREVIEW_DEFAULT[currentMode];
buildCharPanel();
selectKey(currentKeys()[0]);
updateProgress();
updatePreview();
</script>
